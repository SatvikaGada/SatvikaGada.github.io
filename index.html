  <!-- Set the theme before first paint so there is no flash.
       Saved choice wins; on a first visit follow the OS; otherwise dark. -->
  <script>
    (function () {
      var d = document.documentElement;
      d.classList.add("js");
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      d.setAttribute("data-theme", t);
    })();
  </script>

    <section class="section section--contact" id="contact" aria-labelledby="contact-title">
      <div class="container">
        <div id="contact-head"></div>
        <div class="contact-grid grid">
          <div class="contact-info" id="contact-info"></div>

          <div class="contact-form-col">
            <!-- The form is static HTML (not rendered by JS) so Netlify Forms can detect it at deploy time.
                 TODO: choose the provider/endpoint in content.js -> contact.form. -->
            <form class="form" id="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="_gotcha" novalidate>
              <input type="hidden" name="form-name" value="contact">

              <!-- Honeypot: hidden from people, often filled by bots. -->
              <div class="hp" aria-hidden="true">
                <label for="hp-field">Leave this field empty</label>
                <input id="hp-field" type="text" name="_gotcha" tabindex="-1" autocomplete="off">
              </div>

              <div class="field">
                <label for="f-name">Name</label>
                <input id="f-name" name="name" type="text" autocomplete="name" required aria-describedby="f-name-error">
                <p class="field-error" id="f-name-error"></p>
              </div>

              <div class="field">
                <label for="f-email">Email</label>
                <input id="f-email" name="email" type="email" autocomplete="email" inputmode="email" required aria-describedby="f-email-error">
                <p class="field-error" id="f-email-error"></p>
              </div>

              <div class="field">
                <label for="f-message">Message</label>
                <textarea id="f-message" name="message" rows="6" required aria-describedby="f-message-error"></textarea>
                <p class="field-error" id="f-message-error"></p>
              </div>

              <button class="btn btn--secondary form-submit" type="submit" id="form-submit">
                <span class="form-submit-label">Send message</span>
              </button>
            </form>

            <div class="form-status" id="form-status" role="status" aria-live="polite" tabindex="-1"></div>
          </div>
        </div>
      </div>
    </section>
